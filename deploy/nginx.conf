# 5조 팀 서버 리버스 프록시 설정
#
# 한 서버에 두 개의 백엔드가 공존한다:
#   - 메인 백엔드 : 127.0.0.1:8000
#   - RAG 서버    : 127.0.0.1:8001  (이 레포)
#
# 둘 다 로컬(127.0.0.1)에만 바인딩하고, 외부 노출은 이 nginx(80)가 담당한다.
# 평가 도구는 http://16.208.41.218/rag/... 로 RAG 서버를 호출한다.
#
# 설치(서버에서):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/team5
#   sudo ln -sf /etc/nginx/sites-available/team5 /etc/nginx/sites-enabled/team5
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

upstream backend_main {
    server 127.0.0.1:8000;
}

upstream rag_server {
    server 127.0.0.1:8001;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 업로드 크기: RAG /ingest 의 PDF(기본 20MB)보다 약간 여유있게
    client_max_body_size 25m;

    # ---- RAG 서버 ----
    # 외부 경로 /rag/query -> 내부 127.0.0.1:8001/query
    # (끝의 / 가 /rag 접두사를 벗겨서 전달한다)
    location /rag/ {
        proxy_pass http://rag_server/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # X-API-Key 헤더는 기본적으로 그대로 전달된다.
        proxy_read_timeout 120s;   # 생성 지연 대비
        proxy_send_timeout 120s;
    }

    # ---- 메인 백엔드 ----
    # 그 외 모든 요청은 메인 백엔드로.
    location / {
        proxy_pass http://backend_main;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
